name: Publish

# Tokenless publish to npm via Trusted Publishing (OIDC).
# Triggered by pushing a version tag, e.g. `git push origin v0.1.1`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # No NODE_AUTH_TOKEN: OIDC auth + provenance happen automatically because
      # the package has a Trusted Publisher configured on npmjs.com for this repo.
      - run: npm publish
